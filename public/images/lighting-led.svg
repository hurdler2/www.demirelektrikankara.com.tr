<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172033"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC107" stop-opacity="0.2"/><stop offset="0.5" stop-color="#FFC107"/><stop offset="1" stop-color="#FFC107" stop-opacity="0.2"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
