  <rect x="60" y="120" width="480" height="24" rx="12" fill="#FFC107" opacity="0.6" filter="url(#blur)"/>
  <rect x="60" y="126" width="480" height="8" rx="4" fill="url(#strip)"/>
  <rect x="40" y="90" width="520" height="30" rx="6" fill="#1F2A44"/>
  <!-- alt kat -->
  <rect x="120" y="250" width="360" height="20" rx="10" fill="#FF8A00" opacity="0.5" filter="url(#blur)"/>
  <rect x="120" y="256" width="360" height="6" rx="3" fill="url(#strip)"/>
  <rect x="100" y="222" width="400" height="28" rx="6" fill="#1F2A44"/>
  <g fill="#FFC107">
    <circle cx="90" cy="130" r="3"/><circle cx="150" cy="130" r="3"/><circle cx="210" cy="130" r="3"/><circle cx="270" cy="130" r="3"/><circle cx="330" cy="130" r="3"/><circle cx="390" cy="130" r="3"/><circle cx="450" cy="130" r="3"/><circle cx="510" cy="130" r="3"/>
  </g>
</svg>
